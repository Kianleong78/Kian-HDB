    <!-- Global Safe Script Error Guard for Cross-Origin Third-Party Embeds -->
    <script>
      (function() {
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (!msg || msg === 'Script error.' || msg === 'Script error' || !url || url.indexOf(window.location.origin) === -1) {
            return true;
          }
          return false;
        };

        var handleGlobalError = function(e) {
          if (!e) return;
          var msg = (e.message || (e.error && e.error.message) || '').toLowerCase();
          var src = (e.filename || (e.target && e.target.src) || '').toLowerCase();
          if (
            msg.indexOf('script error') !== -1 ||
            msg.indexOf('disqus') !== -1 ||
            msg.indexOf('resizeobserver') !== -1 ||
            src.indexOf('disqus') !== -1 ||
            src.indexOf('embed.js') !== -1
          ) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        };

        window.addEventListener('error', handleGlobalError, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e) {
            var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
            if (typeof reason === 'string' && (reason.indexOf('Script error') !== -1 || reason.indexOf('disqus') !== -1)) {
              e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
  </head>

  </body>
